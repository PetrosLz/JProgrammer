name: CI

on:
  push:
  pull_request:

jobs:
  build-test-benchmark:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Scheduler tests
        run: npm run test:scheduler

      - name: Scheduler benchmark
        run: npm run benchmark:scheduler
